name: doc-tools
name_en: DocKit
name_zh: 文档工具箱
display_name: DocKit · 文档工具箱
family: doctools
form: mac
lifecycle: active
bundle_id: cyou.tianli.DocTools
sop:
  platforms:
    mac: {}
    iphone:
      not_applicable: 当前桌面端用 Foundation.Process 调本机 Python doctools 引擎并处理 Mac 文件路径；iOS 不允许运行这套桌面子进程与工作区。
    ipad:
      not_applicable: 当前桌面端用 Foundation.Process 调本机 Python doctools 引擎并处理 Mac 文件路径；iPadOS 不允许运行这套桌面子进程与工作区。
    watch:
      not_applicable: 当前功能依赖 Mac 本机 Python 文档引擎、子进程及 AppKit 文件选择器；watchOS 不提供这套桌面执行环境。
    vision:
      not_applicable: 当前桌面端依赖 Mac 本机 Python doctools 引擎、Foundation.Process 和 AppKit 文件选择器；visionOS 不提供这套桌面执行环境。
  promo: false
  test: ./build.sh --check
  accept:
    functionality: ~/Dev/.venv/bin/python scripts/accept/functionality.py
    recovery: ~/Dev/.venv/bin/python scripts/accept/recovery.py
    privacy: ~/Dev/.venv/bin/python scripts/accept/privacy.py
    native_ui: bash scripts/accept/native_ui.sh
  test_inputs:
  - tests/**
  - scripts/accept/**
  source_extra_files:
  - /Users/tianli/Dev/tools/doctools/scripts/document/doc_gui_backend.py
  - /Users/tianli/Dev/tools/doctools/scripts/document/doc_dispatch.py
  - /Users/tianli/Dev/tools/doctools/scripts/document/docx_fmt.py
  cli:
    # App 包内 Contents/Resources/bin/dockit（源 bin/dockit），exec ~/Dev/.venv 与父仓 doc_gui_backend.py，
    # 与 GUI 同一个 gui_run；子命令 ops / run / doctor，见 dockit --help。build.sh --install 链到 ~/.local/bin/dockit
    commands: [dockit]
    app: cyou.tianli.DocTools
  ui:
  - Sources/**
  - icon/**
  - Info.plist
  measure:
    app: installed
  source:
  - Sources/**
  - icon/AppIcon.icns
  - Info.plist
  - DocTools.xcodeproj/project.pbxproj
  - build.sh
  - bin/**
  - catalog.yaml
  product:
    distribution: personal
    source_visibility: private
    source_url: ''
    rationale: 本人 doctools 工作流的原生桌面入口，连接现有专业文档操作；与独立公开 DocKit 发行版分开维护。
