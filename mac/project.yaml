name: doc-tools
display_name: DocKit
family: doctools
form: mac
lifecycle: active
bundle_id: cyou.tianli.DocTools
sop:
  promo: false
  test: ./build.sh --check
  ui:
  - Sources/**
  - icon/**
  - Info.plist
  measure:
    app: installed
  source:
  - Sources/**
  - icon/AppIcon.icns
  - Info.plist
  - DocTools.xcodeproj/project.pbxproj
  - build.sh
  product:
    distribution: personal
    source_visibility: private
    source_url: ''
    rationale: 本人 doctools 工作流的原生桌面入口，连接现有专业文档操作；与独立公开 DocKit 发行版分开维护。
