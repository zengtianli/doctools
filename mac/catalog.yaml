name: doc-tools
display_name: DocKit
bundle_id: cyou.tianli.DocTools
domain: apps/desktop
icon_png: icon/AppIcon.png
function: doctools 内部 SwiftUI 文档处理客户端，动态消费 gui-ops 与 gui-run JSON 接口。
public_api: DocKit.app(GUI) → doc_gui_backend.py {gui-ops, gui-run --op <verb> [--to
  T] [--opt K=V]... --files ...} (JSON 信封契约,经 uv run --project ~/Dev 调用;复用 doc_dispatch.py
  路由,零重写业务)
key_scripts:
- Sources/DocToolsApp.swift
- Sources/ContentView.swift
- Sources/ViewModel.swift
- Sources/BackendClient.swift
- Sources/Models.swift
depends_on:
- doctools
tier: PACKAGE
owner: tianli
docs: ./README.md
lifecycle: active
form: mac
backend:
  script: ~/Dev/tools/doctools/scripts/document/doc_gui_backend.py
family: doctools
maintenance:
  role: internal
  parent: ..
