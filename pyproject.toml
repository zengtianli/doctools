[project]
name = "doctools"
# 版本号 SSOT = src/doctools/__init__.py 的 __version__（hatchling 从那儿读，见
# [tool.hatch.version]）。docx_cli.py --version 读的也是同一个文件。
# **这里不许再写一份 version 字面量** —— 两处各写一份正是本仓一直在消灭的形状。
dynamic = ["version"]
description = "文档处理与数据转换工具集：docx/md/pdf/pptx 的读-改-审阅-修订-排版，统一入口 docx_cli（93 条动词）"
requires-python = ">=3.12"
dependencies = [
    # `docx_cli combine` 的实现（sub/combine.py）直接 `from docxcompose.composer
    # import Composer`。以前没声明也能跑，是因为本机走的是共享的 ~/Dev/.venv —— 那里
    # 有别的 member 装的它。干净机器上 combine 直接 rc=2「docxcompose 未安装」
    # （2026-08-02 ubuntu:24.04 容器实测，smoke 13 红里的第 13 条）。
    "docxcompose>=1.4",
    "fastapi>=0.135.3",
    # 总部 ~/Dev/tools/dev/lib 的 6 个平铺模块（display/env/file_ops/finder/
    # parallel_contract/usage_log）的**可分发形态**。本仓 44 处 sys.path 注入照旧
    # 工作，这条只是让 wheel 装到别的机器上时那 6 个名字也 import 得到 ——
    # 没有它，`doctools <任意动词>` 一律死在
    #   ModuleNotFoundError: No module named 'parallel_contract'（实测 0/49）。
    # 分发名是 hq-devlib 不是 devtools：PyPI 上 devtools 已被别人占用，写错名会
    # 静默装回一个完全无关的调试打印库。工作区内它由 [tool.uv.sources] 指回
    # workspace member `tools/dev`，不走网络。
    #
    # ⚠ 写成 **git URL 直接引用**，不是 `hq-devlib>=0.1`（2026-08-03 改）。
    # 用户已拍板不发 PyPI，而 `hq-devlib>=0.1` 这种普通 specifier 在**离开本
    # workspace 的任何环境**里都解析不到 —— 不是「装上后几条动词不能用」，是
    # 依赖解析这一步就死：
    #   × No solution found … Because hq-devlib was not found in the package
    #     registry and your project depends on hq-devlib>=0.1 …
    # （2026-08-03 实测：`git archive HEAD` 到中立目录后 `uv lock` rc=1。CI 的
    #  装依赖步 `uv sync` 与它同一条路径，所以 CI 从声明这条依赖起就是红的。）
    #
    # URL 里**没有 `#subdirectory=`**：zengtianli/devtools 这个仓的**根就是**
    # ~/Dev/tools/dev，hq-devlib 的 pyproject.toml 在仓根（gh api
    # repos/zengtianli/devtools/contents/pyproject.toml 实取，name = "hq-devlib"）。
    # 写成 `#subdirectory=tools/dev` 会当场 clone 完找不到该子目录而失败。
    #
    # ⚠ 直接引用**不能带版本 specifier**（PEP 508：`name @ url` 与 `>=x` 互斥），
    # 所以 `>=0.1` 这层保护没有了。取而代之的保护是 URL 本身钉死了来源仓。
    #
    # ⚠ zengtianli/devtools 是 **PRIVATE**（`gh repo view … --json visibility`
    # 实测 PRIVATE）。所以这条 URL 只有在**带 GitHub 凭证**的环境里才 clone 得动：
    # 本机（git credential helper 有 token）✓；CI 需要 secrets.HQ_DEVTOOLS_TOKEN
    # 配 `url.insteadOf` 重写（gates.yml 已为 sparse-checkout 用同一个 secret）；
    # 完全没有凭证的第三方 ✗ —— 那不是本行能解决的，要么把仓 public，要么给 PAT。
    #
    # 本机行为一个字节不变：workspace 根 ~/Dev/pyproject.toml 的
    # `[tool.uv.sources] hq-devlib = { workspace = true }` 覆盖掉这条 URL，
    # `uv sync --all-packages` 后 uv.lock 里仍是 `source = { virtual = "tools/dev" }`
    # （2026-08-03 改前改后对拍，该行逐字节相同，不走网络）。
    "hq-devlib @ git+https://github.com/zengtianli/devtools.git",
    "lxml>=6.0.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "uvicorn>=0.44.0",
    "xlrd>=2.0.2",
]

# `doctools <sub> …` —— 与 `python3 <abs>/scripts/document/docx_cli.py <sub> …`
# **并存**，不是替代（~/Work 有 130 处绝对路径在消费后者）。两条入口共用同一个
# main()，语义不可能漂移。
[project.scripts]
doctools = "doctools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/doctools/__init__.py"

# `hq-devlib @ git+https://…` 是 PEP 508 的**直接引用**，hatchling 默认把它判成
# 硬错误并让构建整个失败（2026-08-03 实测，连 `uv sync` 都过不去）：
#   ValueError: Dependency #3 of field `project.dependencies` cannot be a direct
#   reference unless field `tool.hatch.metadata.allow-direct-references` is set to `true`
# 它默认关着是因为**带直接引用的包传不上 PyPI**（PyPI 拒收 Requires-Dist 里的 URL）。
# 本仓明确不发 PyPI（用户 2026-08-03 拍板走 git URL），所以这条限制对本仓无意义，
# 打开它。⚠ 反过来说：打开之后 `uv publish` / `twine upload` 会在服务端被拒 ——
# 哪天真要发 index，第一件事是把这行连同上面那条 URL 一起改回普通 specifier。
[tool.hatch.metadata]
allow-direct-references = true

# 只打 doctools/ 这一个包（仓根是 scripts/ lib/ tools/ 这种平铺目录，没有可打的
# 包树）。member 在 uv workspace 里按 editable 装，壳里的相对定位指回真实工作树。
[tool.hatch.build.targets.wheel]
packages = ["src/doctools"]
# 见下面 force-include 前那段注释：`lib/llm_client.py` 是指向仓外绝对路径的 symlink，
# 打进来会让「能不能构建」暗中依赖本机路径。它改由 hq-devlib 出。
exclude = ["lib/llm_client.py"]
# ⚠ `packages` 只管 wheel。**editable 安装另走一条路**：hatchling 默认往
# site-packages 写一个指向**项目根**的 .pth（实测 `_editable_impl_doctools.pth`
# 里就是 `/Users/tianli/Dev/tools/doctools` 整个仓根）。后果是共享的
# ~/Dev/.venv 里凭空多出 lib / scripts / tools / config / handoffs / reports /
# schemas / templates 八个顶层可导入名 —— 而 tools/dev、tools/mactools 两个
# member 共用这个 venv。实测 `import lib` 当场解析到 doctools/lib/__init__.py。
# dev-mode-exact 改成按文件精确映射，只暴露 doctools 这一个名字。

# ─── wheel 自包含：把实现打进包，但**不搬它的物理位置** ───────────────────
# 背景：`packages = ["src/doctools"]` 打出来的 wheel 只有 __init__.py + cli.py 两个壳
# （实测 7 files / 6229 bytes），而 cli.py 靠 `parents[2]` 指回工作树 —— 装到别的机器上
# 必然 `FATAL: 找不到实现入口`（2026-08-02 clean venv 实测 rc=2）。
#
# `scripts/` `lib/` 不能搬（~/Work 有 130 处绝对路径指着它们），所以用 force-include
# 在**构建时**把它们镜像进 `doctools/_bundled/`，工作树里一个字节都不动。
#
# ⚠ 目标路径的**相对深度必须与工作树一致** —— 全仓 40+ 处 `parents[2]/"lib"`（scripts/
# document/*.py）与 `parents[3]/"lib"`（sub/*.py）是硬编码的层数算术。`_bundled/` 下
# scripts 与 lib 仍是兄弟，所以这套算术在包内**原样成立**，一处都不用改。
# 同理 `lib/styles.py` 要 `parents[1]/"config"`、`lib/schemas.py` 要 `../schemas`，
# 故这两个根级资源目录也必须进来，否则 styles / schema 校验类动词在别的机器上会瞎。
#
# force-include 的源端会走 VCS ignore：实测打进来的 109 个文件与
# `git ls-files scripts lib config schemas` **逐个对齐**（__pycache__ / templates 自动
# 落在外面）。这条等式就是「包内副本不会漂」的机器判据，见
# tools/check_wheel_selfcontained.py。
# ⚠ `lib/llm_client.py` 必须排除（2026-08-03 立，由 check_wheel_selfcontained 判据 C
# 头一次跑就抓到）。它在 git 里是 **mode 120000 的 symlink**，指向绝对路径
# `/Users/tianli/Dev/tools/dev/scripts/tools/llm_client.py`。后果是 wheel 的**构建**
# 暗中依赖那条路径在本机解析得开 —— `git archive HEAD` 出来的树里它是条悬空链接，
# GitHub runner 上根本不存在。也就是说判据 A 那句「在没有兄弟 dev/ 的位置构建成功」
# 在本机为真，只是因为绝对路径恰好指得到，与上一轮 `$HOME` 那次假绿是同一形状。
# 修法不是把文件拷一份进仓（那会造出第二份 SSOT），而是让它由 **hq-devlib 出**：
# 该包已把 scripts/tools/llm_client.py 装进 site-packages 顶层，所以 wheel 场景
# `from llm_client import chat` 照样解析得到，本机场景仍走 lib/ 下那条 symlink。
# 两条路都不动任何一行 import。
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "doctools/_bundled/scripts"
"config" = "doctools/_bundled/config"
"schemas" = "doctools/_bundled/schemas"
# ⚠ `lib` **逐文件列**，不写成 `"lib" = "…/lib"` 一行（2026-08-03 改）。
# 唯一的理由是要把 `lib/llm_client.py` 排除在外 —— 它在 git 里是 mode 120000 的
# symlink，指向仓外绝对路径 /Users/tianli/Dev/tools/dev/scripts/tools/llm_client.py。
# 整目录写法会让**构建本身**依赖那条路径解析得开：实测把它换成悬空链接后
#   FileNotFoundError: [Errno 2] No such file or directory: '<proj>/lib/llm_client.py'
#   error: Call to `hatchling.build.build_wheel` failed (exit status: 1)
# 即 doctools 的 wheel 在这台机器之外**根本构建不出来**，而判据 A 一直在打 ✓
# （它在本机构建，绝对路径恰好指得到）—— 与上一轮 $HOME 那次假绿同形。
# `[tool.hatch.build.targets.wheel].exclude` 救不了：force-include 不受 exclude 约束，
# 实测加了之后 `doctools/_bundled/lib/llm_client.py` 照样在 wheel 里。
# llm_client 改由 **hq-devlib** 出（已装进 site-packages 顶层），所以 wheel 场景
# `from llm_client import chat` 照样解析得到，本机场景仍走这条 symlink，import 一行不动。
#
# 漏加新文件不会静默：check_wheel_selfcontained 的判据 C 拿包内文件集与
# `git ls-tree HEAD -- scripts lib config schemas` 对账，**多一个少一个都判红**
# （symlink 类由该判据单独处理：既不要求在包里，也不许在包里）。
"lib/__init__.py" = "doctools/_bundled/lib/__init__.py"
"lib/caption_re.py" = "doctools/_bundled/lib/caption_re.py"
"lib/chapter_numbering.py" = "doctools/_bundled/lib/chapter_numbering.py"
"lib/clipboard.py" = "doctools/_bundled/lib/clipboard.py"
"lib/cn_number.py" = "doctools/_bundled/lib/cn_number.py"
"lib/common.sh" = "doctools/_bundled/lib/common.sh"
"lib/docx_parts.py" = "doctools/_bundled/lib/docx_parts.py"
"lib/docx_revise.py" = "doctools/_bundled/lib/docx_revise.py"
"lib/docx_safe_save.py" = "doctools/_bundled/lib/docx_safe_save.py"
"lib/docx_surgical.py" = "doctools/_bundled/lib/docx_surgical.py"
"lib/docx_xml.py" = "doctools/_bundled/lib/docx_xml.py"
"lib/progress.py" = "doctools/_bundled/lib/progress.py"
"lib/schemas.py" = "doctools/_bundled/lib/schemas.py"
"lib/soffice.py" = "doctools/_bundled/lib/soffice.py"
"lib/styles.py" = "doctools/_bundled/lib/styles.py"
"lib/text_fixes.py" = "doctools/_bundled/lib/text_fixes.py"
# ⚠ 这里**不能**写 `"../dev/lib/xxx.py"` 这种跨仓源端（2026-08-02 实测撤销）。
# force-include 的源端相对 project root 解析，而兄弟目录 `dev/` 只在本机存在 ——
# GitHub runner / 任何别人的机器上构建当场
#   FileNotFoundError: Forced include not found: <root>/../dev/lib/parallel_contract.py
# 而且 hatchling 对 **editable** 构建同样施加 force-include，所以连 `uv sync` 都红。
# 后果：CI 从加上那天起一次都没绿过。
#
# 本仓运行时确实依赖总部 ~/Dev/tools/dev/lib 的 6 个平铺模块
# （finder×10 · file_ops×10 · display×9 · parallel_contract×3 · usage_log×1 · env×1）。
# 2026-08-02 之前它们不是包、只能靠 PYTHONPATH 导入，所以「声明成 dependency」这条路
# 走不通，wheel 装到别的机器上 **0/49** 条动词能跑。现在总部仓把那 6 个打成了
# `hq-devlib`（lib/*.py 零改动），本仓在上面 [project].dependencies 里声明它 ——
# 同一测法变 **49/49**。能力值不写在注释里赌人自觉：它是
# tools/check_wheel_selfcontained.py 的 DECLARED_WORKING，实测对不上就判红
# （多一条少一条两个方向都堵）。

# ⚠ 这里**不能**写 `[tool.uv.sources] hq-devlib = { workspace = true }`（2026-08-02 撤）。
# member 自己的 uv.sources 在**独立 checkout** 里照样被解析，而那时根本没有 workspace：
#   × Failed to build `doctools @ …`
#   ╰─▶ `hq-devlib` references a workspace in `tool.uv.sources`, but is not a workspace member
# CI 的装依赖步就是 `uv sync`，于是 CI 从那个 commit 起全红、11 道闸门一道都不执行 ——
# 与 7735240 修掉的「CI 从来没绿过」是同一个病，只是机制从 force-include 换成了 uv.sources。
# 正确位置是 **workspace 根** `~/Dev/pyproject.toml` 的 [tool.uv.sources]：
# 那份只在工作区内生效，独立 checkout 看不到它。
