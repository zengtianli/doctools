[project]
name = "doctools"
# 版本号 SSOT = src/doctools/__init__.py 的 __version__（hatchling 从那儿读，见
# [tool.hatch.version]）。docx_cli.py --version 读的也是同一个文件。
# **这里不许再写一份 version 字面量** —— 两处各写一份正是本仓一直在消灭的形状。
dynamic = ["version"]
description = "文档处理与数据转换工具集：docx/md/pdf/pptx 的读-改-审阅-修订-排版，统一入口 docx_cli（93 条动词）"
requires-python = ">=3.12"
dependencies = [
    # `docx_cli combine` 的实现（sub/combine.py）直接 `from docxcompose.composer
    # import Composer`。以前没声明也能跑，是因为本机走的是共享的 ~/Dev/.venv —— 那里
    # 有别的 member 装的它。干净机器上 combine 直接 rc=2「docxcompose 未安装」
    # （2026-08-02 ubuntu:24.04 容器实测，smoke 13 红里的第 13 条）。
    "docxcompose>=1.4",
    "fastapi>=0.135.3",
    "lxml>=6.0.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "uvicorn>=0.44.0",
    "xlrd>=2.0.2",
]

# `doctools <sub> …` —— 与 `python3 <abs>/scripts/document/docx_cli.py <sub> …`
# **并存**，不是替代（~/Work 有 130 处绝对路径在消费后者）。两条入口共用同一个
# main()，语义不可能漂移。
[project.scripts]
doctools = "doctools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/doctools/__init__.py"

# 只打 doctools/ 这一个包（仓根是 scripts/ lib/ tools/ 这种平铺目录，没有可打的
# 包树）。member 在 uv workspace 里按 editable 装，壳里的相对定位指回真实工作树。
[tool.hatch.build.targets.wheel]
packages = ["src/doctools"]
# ⚠ `packages` 只管 wheel。**editable 安装另走一条路**：hatchling 默认往
# site-packages 写一个指向**项目根**的 .pth（实测 `_editable_impl_doctools.pth`
# 里就是 `/Users/tianli/Dev/tools/doctools` 整个仓根）。后果是共享的
# ~/Dev/.venv 里凭空多出 lib / scripts / tools / config / handoffs / reports /
# schemas / templates 八个顶层可导入名 —— 而 tools/dev、tools/mactools 两个
# member 共用这个 venv。实测 `import lib` 当场解析到 doctools/lib/__init__.py。
# dev-mode-exact 改成按文件精确映射，只暴露 doctools 这一个名字。

# ─── wheel 自包含：把实现打进包，但**不搬它的物理位置** ───────────────────
# 背景：`packages = ["src/doctools"]` 打出来的 wheel 只有 __init__.py + cli.py 两个壳
# （实测 7 files / 6229 bytes），而 cli.py 靠 `parents[2]` 指回工作树 —— 装到别的机器上
# 必然 `FATAL: 找不到实现入口`（2026-08-02 clean venv 实测 rc=2）。
#
# `scripts/` `lib/` 不能搬（~/Work 有 130 处绝对路径指着它们），所以用 force-include
# 在**构建时**把它们镜像进 `doctools/_bundled/`，工作树里一个字节都不动。
#
# ⚠ 目标路径的**相对深度必须与工作树一致** —— 全仓 40+ 处 `parents[2]/"lib"`（scripts/
# document/*.py）与 `parents[3]/"lib"`（sub/*.py）是硬编码的层数算术。`_bundled/` 下
# scripts 与 lib 仍是兄弟，所以这套算术在包内**原样成立**，一处都不用改。
# 同理 `lib/styles.py` 要 `parents[1]/"config"`、`lib/schemas.py` 要 `../schemas`，
# 故这两个根级资源目录也必须进来，否则 styles / schema 校验类动词在别的机器上会瞎。
#
# force-include 的源端会走 VCS ignore：实测打进来的 109 个文件与
# `git ls-files scripts lib config schemas` **逐个对齐**（__pycache__ / templates 自动
# 落在外面）。这条等式就是「包内副本不会漂」的机器判据，见
# tools/check_wheel_selfcontained.py。
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "doctools/_bundled/scripts"
"lib" = "doctools/_bundled/lib"
"config" = "doctools/_bundled/config"
"schemas" = "doctools/_bundled/schemas"
# ⚠ 这里**不能**写 `"../dev/lib/xxx.py"` 这种跨仓源端（2026-08-02 实测撤销）。
# force-include 的源端相对 project root 解析，而兄弟目录 `dev/` 只在本机存在 ——
# GitHub runner / 任何别人的机器上构建当场
#   FileNotFoundError: Forced include not found: <root>/../dev/lib/parallel_contract.py
# 而且 hatchling 对 **editable** 构建同样施加 force-include，所以连 `uv sync` 都红。
# 后果：CI 从加上那天起一次都没绿过。
#
# 本仓运行时确实依赖总部 ~/Dev/tools/dev/lib 的 6 个平铺模块
# （finder×10 · file_ops×10 · display×9 · parallel_contract×3 · usage_log×1 · env×1）。
# 它们不是包、只能靠 PYTHONPATH 导入，所以**声明成 dependency 也没用**。
# 现状因此是：wheel 里 35/49 个顶层动词能跑，14 个需要总部模块的跑不了。
# 这个能力边界**声明在 doctools/_capability.py，由 tools/check_wheel_selfcontained.py
# 逐条对账**（多一条少一条都判红），不再假装"自包含"。

[tool.uv.sources]
