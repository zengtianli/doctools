[project]
name = "doctools"
# 版本号 SSOT = doctools/__init__.py 的 __version__（hatchling 从那儿读，见
# [tool.hatch.version]）。docx_cli.py --version 读的也是同一个文件。
# **这里不许再写一份 version 字面量** —— 两处各写一份正是本仓一直在消灭的形状。
dynamic = ["version"]
description = "文档处理与数据转换工具集：docx/md/pdf/pptx 的读-改-审阅-修订-排版，统一入口 docx_cli（93 条动词）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "lxml>=6.0.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "uvicorn>=0.44.0",
    "xlrd>=2.0.2",
]

# `doctools <sub> …` —— 与 `python3 <abs>/scripts/document/docx_cli.py <sub> …`
# **并存**，不是替代（~/Work 有 130 处绝对路径在消费后者）。两条入口共用同一个
# main()，语义不可能漂移。
[project.scripts]
doctools = "doctools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "doctools/__init__.py"

# 只打 doctools/ 这一个包（仓根是 scripts/ lib/ tools/ 这种平铺目录，没有可打的
# 包树）。member 在 uv workspace 里按 editable 装，壳里的相对定位指回真实工作树。
[tool.hatch.build.targets.wheel]
packages = ["doctools"]

[tool.uv.sources]
